# WardenMenu — всё меню тут. Кнопка (action):
#   submenu:<id>  — открыть подменю
#   command:<cmd> — выполнить команду от игрока
#   link:<url>    — кинуть кликабельную ссылку в чат
#   stats         — своя статистика
#   top:<kills|playtime|deaths> — лидерборд
#   text / (нет)  — просто инфо (lore), без действия
# Слоты: ряд×9 (0..). rows: 1-6.

tops:
  refresh-minutes: 10
  size: 10

